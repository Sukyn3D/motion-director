<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Director 1.0 · 生命周期回归</title><link rel="stylesheet" href="regressions.css"><script type="module" src="regressions.mjs"></script></head><body>
<header><small>MOTION DIRECTOR / 1.0</small><h1>连续运动，稳定布局。</h1><p>独立样例验证通用机制。点击后移出不用再点击空白；Tab 保留键盘反馈。关闭窗口观察黑色蒙层，快速筛选观察全部卡片。</p></header>
<main><section><h2>01 / 输入来源</h2><div class="actions"><button id="action">试试按钮</button><label>调整参数 <input type="range" id="range" min="0" max="100" value="50"></label><button id="open">打开窗口</button><label><input type="checkbox" id="reduce">减少动态效果</label></div><output id="input-status">等待输入</output></section>
<section><h2>02 / 原子布局事务</h2><div class="filters"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="a" aria-pressed="false">A 类</button><button data-filter="b" aria-pressed="false">B 类</button></div><div id="grid"><article data-item="one" data-category="a"><span>01</span><strong>FIRST FORM</strong></article><article data-item="two" data-category="b"><span>02</span><strong>SECOND SIGNAL</strong></article><article data-item="three" data-category="b"><span>03</span><strong>THIRD TYPE</strong></article><article data-item="four" data-category="a"><span>04</span><strong>FOURTH FIELD</strong></article></div></section>
<section><h2>03 / 媒体自然约束</h2><div class="media-pair"><figure id="baseline"><figcaption>原布局 / auto + max-height</figcaption><img src="../experience/poster.svg" width="960" height="540" alt="原版布局验证图"><p>相邻文字与按钮不被图像侵入。</p><button>原布局按钮</button></figure><figure id="enhanced"><figcaption>直接呈现层 / 保留原约束</figcaption><img src="../experience/poster.svg" width="960" height="540" alt="动效布局验证图"><p>相邻文字与按钮不被图像侵入。</p><button>增强版按钮</button></figure></div></section>
<details><summary>实际逐帧记录（只读）</summary><pre id="evidence"></pre></details></main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="panel"><h2 id="dialog-title">蒙层也有退出。</h2><p>面板与 backdrop 各自耗散，完成后才关闭原生窗口。Esc 关闭，关闭中可以用右上角“反向重开”改变意图。</p><button id="close">关闭窗口</button><button id="reopen">反向重开</button></div></dialog>
</body></html>
