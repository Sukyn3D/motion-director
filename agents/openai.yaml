interface:
  display_name: "Motion Director 1.0"
  short_description: "网页与 App 动效设计优化，完整执行、可感知表达、尺寸与布局连续及案例库选型"
  default_prompt: "请使用 $motion-director，对本网站所有页面、组件家族及真实实例进行完整动效审计与实现：在保持现有技术框架、品牌、内容、业务行为和静态布局端点不变的前提下，遵循 skill 的五套并列依据与适用案例，优化所有未达要求的已有动效，补齐适合运动表达但缺少反馈的交互与内容呈现，覆盖入场、滚动进退、悬停、键盘焦点、按压、状态切换、尺寸重排、页面及弹窗进出等完整生命周期，确保焦点来源正确、运动可中断反向、蒙层完整退出、重排无闪帧、动效层不改变自然布局且保留有效反馈强度，并用真实操作验证桌面与窄屏、快速连续输入、键盘/触屏及减少动效，修复回归后交付可运行成品、覆盖清单、实际验证证据和未验证边界。"
policy:
  allow_implicit_invocation: true
